[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christopherfretz/mortar"
publish = false

# No third-party dependencies in the shipped crates (docs/ARCHITECTURE.md,
# principle 5). Each exception is approved in a work package and recorded
# here with its reason.
[workspace.dependencies]
mortar          = { path = "crates/mortar" }
mortar_cli      = { path = "crates/mortar_cli" }
mortar_a64      = { path = "crates/mortar_a64" }
mortar_arch     = { path = "crates/mortar_arch" }
mortar_core     = { path = "crates/mortar_core" }
mortar_diag     = { path = "crates/mortar_diag" }
mortar_digest   = { path = "crates/mortar_digest" }
mortar_elf      = { path = "crates/mortar_elf" }
mortar_image    = { path = "crates/mortar_image" }
mortar_incr     = { path = "crates/mortar_incr" }
mortar_input    = { path = "crates/mortar_input" }
mortar_layout   = { path = "crates/mortar_layout" }
mortar_live     = { path = "crates/mortar_live" }
mortar_merge    = { path = "crates/mortar_merge" }
mortar_meta     = { path = "crates/mortar_meta" }
mortar_odr      = { path = "crates/mortar_odr" }
mortar_plumb    = { path = "crates/mortar_plumb" }
mortar_resolve  = { path = "crates/mortar_resolve" }
mortar_scan     = { path = "crates/mortar_scan" }
mortar_script   = { path = "crates/mortar_script" }
mortar_synth    = { path = "crates/mortar_synth" }
mortar_testutil = { path = "crates/mortar_testutil" }
mortar_x64      = { path = "crates/mortar_x64" }
mortar_x86      = { path = "crates/mortar_x86" }
xtask           = { path = "xtask" }
# Third-party (each approved in a work package; docs/AGENTS.md rule 3).
# signal-hook: xtask, and only xtask, kills its children and returns its
# held jobserver tokens on SIGINT/SIGTERM (WP-003, spec/harness.md
# "Jobserver"); the signal-handler `unsafe` stays in the dependency, xtask
# itself remains `forbid(unsafe_code)`. Same choice as kiln and hod.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# The linker is run once per edit: start-up cost and straight-line speed
# both matter. Whole-program LTO and one code unit, as in hod (its WP-068
# measured a smaller binary with fewer start-up page faults). A panic is a
# bug of mortar's: the process aborts, no caller catches it. Tests keep
# unwinding (cargo ignores `panic` for test targets).
# Line tables only in debug builds: a backtrace keeps its file and line,
# and a worktree's target directory loses most of its size (the test
# binaries were about 100 MB each with full debug information, 9 GB per
# worktree).
[profile.dev]
debug = "line-tables-only"

# The verifier runs thousands of times in every gate (L3 judges each link
# output; the sweep judges each mutant): its own code and the readers it
# uses are optimised in debug builds too. Debug assertions and overflow
# checks stay on.
[profile.dev.package.mortar_plumb]
opt-level = 2

[profile.dev.package.mortar_elf]
opt-level = 2

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
panic = "abort"
