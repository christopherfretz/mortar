name: mortar-ci
description: >
  The setup of a job of .github/workflows/ci-lane.yml (spec/harness.md
  "Hosted CI"), after hod's hod-ci and kiln's kiln-ci actions: the
  reference tools of scripts/ci-tools.sh (Debian 13's GNU toolchains of
  the three architectures, LLVM 22, mold, qemu-user; the pinned versions
  checked), the pinned Rust toolchain, the cargo cache, and the jobserver
  pool (scripts/jobserver.sh) sized to the runner. The job env's
  MORTAR_REQUIRE_TOOLS=1 makes any tool missing from that list a test
  failure, never a skip. A local action is only readable after checkout,
  so the job checks out first.
inputs:
  cache-key:
    description: rust-cache's shared-key; one per architecture.
    required: true
  save-cache:
    description: '"true" in the job that saves the cache.'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the reference tools
      shell: bash
      run: |
        # The one list of the gate's tools: installs what the image lacks,
        # then checks every tool and the pinned versions (exit 1 if not).
        "$GITHUB_WORKSPACE/scripts/ci-tools.sh"
        echo "processors: $(nproc)"; free -g | head -2
        # The container runs as root over a checkout the runner owns;
        # scripts/env.sh and scripts/jobserver.sh ask git where the
        # checkout is.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        # The build directory outside the checkout, as for a worktree on
        # the development machine (scripts/env.sh keeps a preset one), at
        # a path every later step and the cache know.
        echo "CARGO_TARGET_DIR=$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
    # As hod-ci and kiln-ci: the job runs as root in a container whose
    # $HOME is /github/home while root's passwd home is /root, which
    # rustup-init's anti-sudo check refuses. rust-toolchain.toml pins the
    # same version.
    - uses: dtolnay/rust-toolchain@stable
      with: { toolchain: "1.95.0", components: "rustfmt, clippy" }
      env: { RUSTUP_INIT_SKIP_SUDO_CHECK: "yes" }
    # ~/.cargo and the dependency builds (signal-hook, xtask's one
    # dependency, and what it pulls in), keyed per architecture; the
    # workspace crates are left out, as in kiln and hod: a fresh checkout
    # gives every source a new mtime, so cargo rebuilds them anyway.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ". -> ../target"
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-on-failure: true
    # The jobserver pool (spec/harness.md "Jobserver"), one token per
    # processor of the runner: scripts/env.sh exports MAKEFLAGS while its
    # fifo exists, so cargo, rustc, the test binaries and xtask's children
    # draw from it as they do on the development machine. Its holder and
    # refill loop end with the job's container.
    - name: Start the jobserver pool
      shell: bash
      run: |
        MORTAR_JOBS="$(nproc)" "$GITHUB_WORKSPACE/scripts/jobserver.sh" start
        "$GITHUB_WORKSPACE/scripts/jobserver.sh" status
