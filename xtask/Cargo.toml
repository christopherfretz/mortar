[package]
name = "xtask"
description = "Developer tasks: the CI entry point, link tests, differential runs, benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The jobserver client, shared with the test binaries (spec/harness.md
# "Jobserver"); also the support of xtask's own tests.
mortar_testutil.workspace = true
# The verifier behind `cargo xtask plumb` (spec/plumb.md §8).
mortar_plumb.workspace = true
# Reads kiln/hod, GCC and Clang objects for `cargo xtask mason census`
# (spec/landed/mason/WP-033.md).
mortar_elf.workspace = true
# SHA-256 of the outputs `cargo xtask static-identical` records
# (spec/harness.md "static-identical").
mortar_digest.workspace = true
# The Mason metadata writer and reader behind `cargo xtask meta` (the test
# producer and dumper of spec/meta.md §12; the format's one implementation).
mortar_meta.workspace = true

# Kills the children and returns the held jobserver tokens on SIGINT/SIGTERM
# (spec/harness.md "Jobserver", "Signals").
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[lints]
workspace = true
